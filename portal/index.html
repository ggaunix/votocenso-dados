<style>
/* Layout: painel de busca à esquerda, ficha do candidato à direita (mapa, perfil, dispersão, tabela). Empilha no celular. */
:root {
  --papel: #f5f6f7;
  --folha: #ffffff;
  --tinta: #17202b;
  --tinta-2: #4d5866;
  --tinta-3: #7d8794;

  --carimbo: #b0245b;
  --carimbo-fundo: #fbe9f0;

  --ok: #1f7a4d;
  --aviso: #8a5a00;
  --aviso-fundo: #fff4dc;
  --r0: #f6d9e5; --r1: #eeb3ca; --r2: #df7fa4; --r3: #c94b7f; --r4: #a32460; --r5: #6e0f3e;

  --f-dado: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --papel: #0f141a; --folha: #161d26; --tinta: #e5eaf0; --tinta-2: #aab4c0; --tinta-3: #7c8794;
  --linha: #26303c; --linha-2: #35414f; --carimbo: #f27aa6; --carimbo-fundo: #33192a;
  --frio: #7fb0e6; --frio-fundo: #172636; --ok: #5fcf96; --aviso: #f0c060; --aviso-fundo: #2e2410;
  --r0: #3a2030; --r1: #5e2745; --r2: #8f325f; --r3: #c4467e; --r4: #ec74a5; --r5: #ffb3d1;
  --mapa-fundo: #131a22; color-scheme: dark; } }
:root[data-theme="dark"] {
  --papel: #0f141a; --folha: #161d26; --tinta: #e5eaf0; --tinta-2: #aab4c0; --tinta-3: #7c8794;
  --linha: #26303c; --linha-2: #35414f; --carimbo: #f27aa6; --carimbo-fundo: #33192a;
  --frio: #7fb0e6; --frio-fundo: #172636; --ok: #5fcf96; --aviso: #f0c060; --aviso-fundo: #2e2410;
  --r0: #3a2030; --r1: #5e2745; --r2: #8f325f; --r3: #c4467e; --r4: #ec74a5; --r5: #ffb3d1;
  --mapa-fundo: #131a22; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--papel); color: var(--tinta); font: 15px/1.45 var(--f-texto);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--carimbo); outline-offset: 2px; }
.num, td.n, .dado { font-family: var(--f-dado); font-variant-numeric: tabular-nums; }

/* topo */
.topo { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 14px 12px; border-bottom: 1px solid var(--linha); }
.marca { font: 800 22px/1 var(--f-display); font-stretch: 78%; letter-spacing: .01em; text-transform: uppercase; margin: 0; }
.marca span { color: var(--carimbo); }
.recorte { display: flex; align-items: center; gap: 8px; }
.rotulo { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-3); font-weight: 600; }
select, input[type=search] { background: var(--folha); border: 1px solid var(--linha-2); border-radius: 6px; padding: 6px 10px; min-height: 36px; max-width: 100%; }
.topo .fontes { margin-left: auto; font-size: 13px; color: var(--tinta-2); }

.topo .fontes div { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 2000; background: var(--folha); border: 1px solid var(--linha-2); border-radius: 8px; padding: 12px 14px; max-width: min(520px, calc(100vw - 32px)); box-shadow: 0 8px 24px rgb(0 0 0 / .12); }

.faixa-demo { margin-top: 12px; background: var(--aviso-fundo); color: var(--aviso); border-radius: 8px; padding: 10px 14px; font-weight: 500; }

/* app */
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; padding-block: 18px 40px; align-items: start; }
@media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); } }

.lista { position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 24px); min-width: 0; }
@media (max-width: 900px) { .lista { position: static; max-height: none; } }
.abas { display: flex; gap: 4px; flex-wrap: wrap; }
.aba { border: 1px solid var(--linha-2); background: transparent; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--tinta-2); }
.aba[aria-pressed="true"] { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.filtro-lista { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--tinta-2); }
.cands { list-style: none; margin: 0; padding: 0; overflow-y: auto; border-top: 1px solid var(--linha); flex: 1; min-height: 120px; }
@media (max-width: 900px) { .cands { max-height: 300px; } }
.cand { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 6px; border-bottom: 1px solid var(--linha); cursor: pointer; }
.cand:hover { background: var(--folha); }
.cand[aria-current="true"] { background: var(--carimbo-fundo); }
.cand .nome { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.cand .sub { grid-column: 1; font-size: 12px; color: var(--tinta-3); }
.cand .votos { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 13px; color: var(--tinta-2); text-align: right; }
.cand.sem-detalhe { opacity: .55; cursor: default; }
.pilula { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border-radius: 4px; padding: 1px 5px; vertical-align: 1px; }
.pilula.eleito { background: var(--ok); color: var(--papel); }
.pilula.nao { background: var(--linha); color: var(--tinta-2); }

/* ficha */
.ficha { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.cabeca { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 28px; }
.cabeca h2 { font: 800 clamp(28px, 4.2vw, 44px)/1 var(--f-display); font-stretch: 80%; margin: 0; text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere; }
.cabeca .meta { color: var(--tinta-2); margin-top: 6px; }
.cabeca .total { margin-left: auto; text-align: right; }
.cabeca .total b { display: block; font: 700 clamp(26px, 3.6vw, 38px)/1 var(--f-dado); }
.cabeca .total span { font-size: 12px; color: var(--tinta-3); }
.numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.numeros > div { position: relative; background: var(--folha); border: 1px solid var(--linha); border-radius: 8px; padding: 10px 14px; min-width: 0; }
.numeros b { display: block; font: 600 20px/1.2 var(--f-dado); }
.numeros b small { font: 500 13px var(--f-dado); color: var(--tinta-3); }
.numeros .rot { font-size: 12px; color: var(--tinta-3); }
.ajuda { display: inline-grid; place-items: center; width: 16px; height: 16px; margin-left: 4px; padding: 0; border: 1px solid var(--linha-2); border-radius: 50%; background: var(--papel); color: var(--tinta-2); font: 600 10px/1 var(--f-texto); cursor: help; vertical-align: 1px; }
.ajuda:hover, .ajuda:focus-visible { border-color: var(--tinta-2); color: var(--tinta); }
.ajuda::after { content: attr(data-dica); position: absolute; left: 8px; right: 8px; top: calc(100% + 6px); z-index: 1500; background: var(--tinta); color: var(--papel); font: 400 12.5px/1.4 var(--f-texto); text-align: left; padding: 8px 10px; border-radius: 6px; box-shadow: 0 6px 18px rgb(0 0 0 / .2); opacity: 0; pointer-events: none; transition: opacity .12s; }
.ajuda:hover::after, .ajuda:focus::after { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .ajuda::after { transition: none; } }
.top { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 0 24px; margin: 0; padding: 0; list-style: none; }
.top li { border-bottom: 1px solid var(--linha); }
.top button { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 2px 10px; width: 100%; padding: 7px 4px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 4px; }
.top button:hover:not(:disabled) { background: var(--carimbo-fundo); }
.top button:disabled { cursor: default; }
.top .pos { grid-row: 1 / span 2; font: 600 14px/1.6 var(--f-dado); color: var(--tinta-3); }
.top .nm { font-weight: 600; overflow-wrap: anywhere; }
.top .onde { grid-column: 2; font-size: 12px; color: var(--tinta-3); }
.top .vt { grid-row: 1 / span 2; grid-column: 3; text-align: right; font: 500 14px/1.3 var(--f-dado); }
.top .vt small { display: block; font-size: 11.5px; color: var(--tinta-3); }
.controles { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.controles label { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; max-width: 100%; }
.controles select { flex: 1 1 180px; min-width: 0; max-width: 100%; }
.grade { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 1100px) { .grade { grid-template-columns: minmax(0, 1fr); } }
.cartao { background: var(--folha); border: 1px solid var(--linha); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.cartao h3 { font: 700 15px/1.2 var(--f-display); font-stretch: 90%; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 4px; }
.cartao .expl { font-size: 13px; color: var(--tinta-2); margin: 0 0 10px; max-width: 70ch; }
#mapa { height: 460px; border-radius: 6px; background: var(--mapa-fundo); }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--tinta-2); margin-top: 8px; }
.legenda .faixa { display: inline-flex; align-items: center; gap: 5px; }
.legenda .faixa i { width: 14px; height: 10px; display: block; border-radius: 2px; }
.vazio { padding: 30px 10px; text-align: center; color: var(--tinta-3); }

/* perfil */
.perfil-leg { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; font-size: 12px; color: var(--tinta-2); margin-bottom: 6px; }
.perfil-leg i { display: inline-block; vertical-align: -1px; margin-right: 5px; }

.perfil-leg .tr { width: 3px; height: 13px; background: var(--tinta); }
.perfil h4 { margin: 12px 0 2px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--tinta-3); }
.perfil .ln { display: grid; grid-template-columns: minmax(100px, 1fr) minmax(120px, 1.7fr) 112px; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--linha); font-size: 13px; }
.perfil .rotulo-ind { min-width: 0; }
.perfil .regua { position: relative; height: 22px; }
.perfil .regua .eixo { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--linha-2); border-radius: 1px; }
.perfil .regua .ext { position: absolute; top: 14px; font: 10px/1 var(--f-dado); color: var(--tinta-3); }
.perfil .regua .ext.a { left: 0; } .perfil .regua .ext.b { right: 0; }
.perfil .regua .ele { position: absolute; z-index: 2; top: 0; width: 3px; height: 22px; margin-left: -1.5px; background: var(--tinta); border-radius: 1px; box-shadow: 0 0 0 1px var(--folha); }
.perfil .regua .cand { position: absolute; z-index: 1; top: 5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--carimbo); border: 2px solid var(--folha); }
.perfil .val { text-align: right; font-family: var(--f-dado); font-variant-numeric: tabular-nums; }
.perfil .val b { display: block; font-weight: 600; }
.perfil .val span { font-size: 11.5px; color: var(--tinta-3); }
.perfil .val span.mais { color: var(--carimbo); } .perfil .val span.menos { color: var(--frio); }
.perfil .soma { padding: 6px 0 2px; font-size: 12px; color: var(--tinta-3); text-align: right; }
.perfil .soma b { color: var(--tinta); font-family: var(--f-dado); font-weight: 600; }
.contas { position: relative; margin-top: 6px; font-size: 13.5px; color: var(--tinta-2); max-width: 75ch; }
.contas b { color: var(--tinta); font-family: var(--f-dado); font-weight: 600; }
.barra svg { display: block; width: 100%; height: 14px; }

/* dispersão */
#disp { width: 100%; height: 300px; display: block; }
.disp-topo { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.corr { font-size: 13px; color: var(--tinta-2); }

/* tabela */
.tab-topo { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.tab-topo h3 { margin: 0; }
.ordena { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
table.dados th::after { content: " ⇅"; color: var(--linha-2); }
table.dados th[aria-sort]::after { content: ""; }
.rolagem { overflow-x: auto; }
table.dados { border-collapse: collapse; width: 100%; font-size: 13px; }
table.dados th { position: sticky; top: 0; background: var(--folha); text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--tinta-3); padding: 6px 8px; border-bottom: 1px solid var(--linha-2); cursor: pointer; white-space: nowrap; user-select: none; }
table.dados th.n { text-align: right; }
table.dados th[aria-sort] { color: var(--tinta); }
table.dados td { padding: 5px 8px; border-bottom: 1px solid var(--linha); vertical-align: top; }
table.dados td.n { text-align: right; white-space: nowrap; }
table.dados td.t { min-width: 160px; }
table.dados td.m { white-space: nowrap; }
.paginas { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 10px; font-size: 13px; color: var(--tinta-2); }
.botao { border: 1px solid var(--linha-2); background: var(--folha); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 13px; }
.botao:hover:not(:disabled) { border-color: var(--tinta-2); }
.botao:disabled { opacity: .45; cursor: default; }
.botao.forte { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.nota { font-size: 12px; color: var(--tinta-3); }
.carregando { padding: 60px 0; text-align: center; color: var(--tinta-2); }

/* Leaflet (CSS mínimo, o script vem do cdnjs) */
.leaflet-pane, .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow, .leaflet-tile-container, .leaflet-pane > svg, .leaflet-pane > canvas, .leaflet-zoom-box, .leaflet-image-layer, .leaflet-layer { position: absolute; left: 0; top: 0; }

.leaflet-container img.leaflet-tile { max-width: none !important; }

.pop .end { color: var(--tinta-2); font-size: 12px; margin-bottom: 6px; }

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<header class="topo">
  <h1 class="marca">Origem <span>do</span> Voto</h1>
  <div class="recorte"><label class="rotulo" for="sel-recorte">Recorte</label><select id="sel-recorte"></select></div>
  <details class="fontes"><summary>Fontes e método</summary><div id="fontes"></div></details>
</header>
<div id="faixa-demo" class="faixa-demo" hidden>Dados sintéticos de demonstração. Os dados oficiais do TSE e do Censo 2022 entram assim que o processamento rodar.</div>

<main class="app" id="app">
  <aside class="lista" aria-label="Candidatos">
    <div class="abas" id="abas-cargo" role="group" aria-label="Cargo"></div>
    <input type="search" id="busca" placeholder="Nome, número ou partido" autocomplete="off" aria-label="Buscar candidato">
    <div class="abas" id="abas-sit" role="group" aria-label="Situação">
      <button class="aba" data-sit="todos" aria-pressed="true">Todos</button>
      <button class="aba" data-sit="eleitos" aria-pressed="false">Eleitos</button>
      <button class="aba" data-sit="nao" aria-pressed="false">Não eleitos</button>
    </div>
    <label class="filtro-lista"><input type="checkbox" id="so-detalhe" checked> <span id="rot-detalhe">Só candidatos com mapa (eleitos e mais votados)</span></label>
    <ul class="cands" id="cands"></ul>
    <p class="nota" id="nota-lista"></p>
  </aside>

  <section class="ficha" id="ficha" aria-live="polite">
    <div class="carregando" id="carregando">Carregando dados…</div>
  </section>
</main>

<template id="tpl-ficha">
  <div class="cabeca">
    <div>
      <h2 id="c-nome"></h2>
      <div class="meta" id="c-meta"></div>
      <div class="contas" id="c-contas"></div>
    </div>
    <div class="total"><b id="c-votos" class="num"></b><span id="c-votos-rot"></span></div>
  </div>
  <div class="numeros" id="c-numeros"></div>
  <div class="cartao">
    <div class="tab-topo">
      <h3 id="top-titulo">Os 10 locais mais fortes</h3>
      <div class="abas" id="abas-top" role="group" aria-label="Ordenar locais por">
        <button class="aba" data-ord="votos" aria-pressed="true">Mais votos</button>
        <button class="aba" data-ord="pct" aria-pressed="false">Maior % dos válidos</button>
      </div>
    </div>
    <p class="expl" id="top-expl">Clique num local para vê-lo no mapa.</p>
    <ol class="top" id="c-top"></ol>
  </div>
  <div class="controles">
    <label><span class="rotulo">Município</span><select id="sel-mun"></select></label>
    <label><span class="rotulo">Censo do</span><select id="sel-nivel"></select></label>
  </div>
  <div class="grade">
    <div class="cartao">
      <h3>Onde estão os votos</h3>
      <p class="expl">Cada círculo é um local de votação. O tamanho mostra os votos do candidato ali; a cor, a fatia dele nos votos válidos do local.</p>
      <div id="mapa"></div>
      <div class="legenda" id="legenda"></div>
    </div>
    <div class="cartao">
      <h3>Perfil de onde vieram os votos</h3>
      <p class="expl" id="perfil-expl"></p>
      <div class="perfil-leg"><span><i class="pt"></i>média dos votos dele</span><span><i class="tr"></i>média do eleitorado</span><span>ao lado, a diferença para o eleitorado (p.p. = pontos percentuais)</span><span>régua: dos 10% de locais mais baixos aos 10% mais altos</span></div>
      <div class="perfil" id="perfil"></div>
    </div>
  </div>
  <div class="cartao">
    <div class="disp-topo">
      <div><h3>Força do candidato × perfil do entorno</h3>
      <p class="expl">Cada ponto é um local de votação (tamanho = votos válidos). Linha: tendência ponderada pelos válidos.</p></div>
      <label><span class="rotulo">Eixo horizontal</span> <select id="sel-x"></select></label>
    </div>
    <canvas id="disp" role="img" aria-label="Gráfico de dispersão"></canvas>
    <div class="corr" id="corr"></div>
  </div>
  <div class="cartao">
    <div class="tab-topo">
      <div class="abas" id="abas-tab" role="group" aria-label="Tabela">
        <button class="aba" data-tab="secoes" aria-pressed="true">Por seção</button>
        <button class="aba" data-tab="locais" aria-pressed="false">Por local</button>
        <button class="aba" data-tab="bairros" aria-pressed="false">Por bairro</button>
      </div>
      <div class="ordena"><label for="sel-ord" class="rotulo">Ordenar por</label>
        <select id="sel-ord"><option value="votos">Mais votos</option><option value="pct">Maior % dos válidos</option><option value="pct_asc">Menor % dos válidos</option><option value="val">Mais votos válidos (tamanho)</option></select>
        <button class="botao" id="exportar" hidden>Baixar CSV</button></div>
    </div>
    <p class="nota" id="nota-ord"></p>
    <div class="rolagem"><table class="dados" id="tabela"></table></div>
    <div class="paginas"><span id="pag-info"></span><button class="botao" id="pag-ant">Anterior</button><button class="botao" id="pag-prox">Próxima</button></div>
  </div>
</template>

<script>
"use strict";
const fmt = new Intl.NumberFormat("pt-BR");
const fmt1 = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtR = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toUpperCase();
const pad = (n, k) => String(n ?? "").padStart(k, "0");
const COLUNAS_TAB = ["renda_media_responsavel", "pct_alfabetizados_15_mais", "pct_preta_parda", "pct_60_mais", "pct_pop_favela", "densidade_hab_km2"];
const PERFIL_FORA = new Set(["pop", "domicilios"]);

const E = { recortes: [], recorte: null, meta: null, L: null, lim: null, cargo: null, cand: null, dadosCand: null,
  sit: "todos", mun: -1, nivel: "raio", tab: "secoes", ord: { col: "votos", dir: -1 }, ordTop: "votos", pag: 0, x: "renda_media_responsavel", busca: "" };
let mapa = null, camadaPontos = null, camadaLim = null, downloads = null;
const fatorZoom = () => mapa ? Math.min(1.3, Math.max(0.3, (mapa.getZoom() - 5) / 6)) : 1;

// Arquivos grandes vão comprimidos (gzip) e em base64 num .txt, que é o formato que a hospedagem serve.
async function carregar(caminho) {
  const z = caminho.endsWith(".json.gz");
  const url = z ? caminho.replace(/\.json\.gz$/, ".b64.txt") : caminho;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  let buf;
  if (z) {
    const bin = atob((await r.text()).trim());
    buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  } else buf = new Uint8Array(await r.arrayBuffer());
  if (buf[0] === 0x1f && buf[1] === 0x8b) {
    const s = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(s).json();
  }
  return JSON.parse(new TextDecoder().decode(buf));
}

function valor(ind, v) {
  if (v == null || Number.isNaN(v)) return "–";
  const meta = E.meta.indicadores.find(i => i.chave === ind) || {};
  if (meta.unidade === "R$") return fmtR.format(v);
  if (meta.unidade === "%") return fmt1.format(v) + "%";
  return fmt.format(Math.round(v));
}
const rotuloInd = k => (E.meta.indicadores.find(i => i.chave === k) || { rotulo: k }).rotulo;
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------------------------------------------------------------- carga */
function mostrarErro(msg) {
  const alvo = $("#ficha");
  if (alvo) alvo.innerHTML = `<div class="vazio">Algo deu errado ao montar a página: <span class="num">${esc(msg)}</span>. Recarregue; se continuar, me mande essa mensagem.</div>`;
}
async function iniciar() {
  try {
    E.recortes = await carregar("dados/index.json");
  } catch (e) {
    $("#carregando").textContent = "Não consegui carregar a lista de recortes (dados/index.json).";
    return;
  }
  const sel = $("#sel-recorte");
  sel.innerHTML = E.recortes.map(r => `<option value="${esc(r.id)}">${esc(r.rotulo)}</option>`).join("");
  sel.addEventListener("change", () => abrirRecorte(sel.value));
  const api = window.claude;  // só existe dentro do claude.ai; no GitHub Pages fica undefined
  if (api && typeof api.use === "function") {
    api.use("downloads").then(d => { downloads = d; const b = $("#exportar"); if (b) b.hidden = !d; }).catch(() => {});
  }
  await abrirRecorte(E.recortes[0].id);
}

async function abrirRecorte(id) {
  try { await abrirRecorte_(id); } catch (e) { mostrarErro(e.message || String(e)); }
}
async function abrirRecorte_(id) {
  $("#ficha").innerHTML = `<div class="carregando">Carregando ${esc(id)}…</div>`;
  const base = `dados/${id}/`;
  E.recorte = id;
  E.meta = await carregar(base + "meta.json");
  E.L = await carregar(base + "locais.json.gz");
  E.lim = E.meta.limites ? await carregar(base + "limites.json.gz").catch(() => null) : null;
  $("#faixa-demo").hidden = !E.meta.demo;
  if (E.meta.min_votos_mapa) $("#rot-detalhe").textContent = `Só candidatos com mapa (eleitos e todos com ${fmt.format(E.meta.min_votos_mapa)} votos ou mais)`;
  montarFontes();
  const cargos = Object.keys(E.meta.cargos);
  E.cargo = cargos.includes("6") ? "6" : cargos[0];
  $("#abas-cargo").innerHTML = cargos.map(c =>
    `<button class="aba" data-cargo="${c}" aria-pressed="${c === E.cargo}">${esc(E.meta.cargos[c].nome)}</button>`).join("");
  desenharLista();
  const pedido = (location.hash || "").replace("#c", "");
  const alvo = E.meta.candidatos.find(c => c.id === pedido && c.detalhe)
    || E.meta.candidatos.find(c => String(c.cargo) === E.cargo && c.detalhe);
  if (alvo) await abrirCandidato(alvo.id);
  else $("#ficha").innerHTML = `<div class="vazio">Nenhum candidato com detalhe neste recorte.</div>`;
}

function montarFontes() {
  const m = E.meta, a = m.avisos || {};
  $("#fontes").innerHTML = `
    <p><b>${esc(m.uf)} · eleições ${m.ano} · ${m.turno}º turno.</b> Processado em ${esc((m.gerado_em || "").replace("T", " "))} UTC.</p>
    <p>Os votos de cada seção vêm do TSE. O censo do entorno de cada local de votação vem do Censo 2022 do IBGE, em três níveis: o setor censitário onde fica o local, os setores num raio de ${fmt.format(m.raio_m)} m e o bairro do IBGE.</p>
    <p>${fmt.format(a.locais_sem_coordenada || 0)} de ${fmt.format(a.locais_total || 0)} locais vieram sem coordenada do TSE e ficam fora do mapa e do perfil. ${a.votos_sem_local ? fmt.format(a.votos_sem_local) + " votos de seções sem local identificado também ficam fora." : ""}</p>
    ${m.cargos["5"] ? `<p>Senador: em ${m.ano} cada eleitor de ${esc(m.uf)} votou em dois candidatos. O % de um candidato num local é sobre o total de votos válidos para senador ali, que conta os dois votos de cada eleitor.</p>` : ""}
    <p>Percentuais do censo usam a soma das próprias categorias como denominador (células suprimidas pelo IBGE ficam de fora). Renda é a média do rendimento do responsável pelo domicílio, ponderada pelo número de responsáveis.</p>
    <ul>${(m.fontes || []).map(f => `<li>${esc(f)}</li>`).join("")}</ul>`;
}

/* ---------------------------------------------------------------- lista */
function desenharLista() {
  const q = norm(E.busca), so = $("#so-detalhe").checked;
  const todos = q ? E.meta.candidatos : E.meta.candidatos.filter(c => String(c.cargo) === E.cargo);
  const eleito = c => /^ELEITO/i.test(c.situacao);
  const filtrados = todos.filter(c => (!so || c.detalhe) && (E.sit === "todos" || (E.sit === "eleitos") === eleito(c)) &&
    (!q || norm(c.nome).includes(q) || String(c.nr).startsWith(q) || norm(c.partido) === q));
  const vis = filtrados.slice(0, 300);
  $("#cands").innerHTML = vis.map(c => {
    const el = /^ELEITO/i.test(c.situacao);
    return `<li class="cand${c.detalhe ? "" : " sem-detalhe"}" data-id="${c.id}" tabindex="${c.detalhe ? 0 : -1}" aria-current="${c.id === E.cand}">
      <span class="nome">${esc(c.nome)}</span>
      <span class="votos num">${fmt.format(c.votos)}</span>
      <span class="sub">${q && String(c.cargo) !== E.cargo ? esc(E.meta.cargos[c.cargo].nome) + " · " : ""}${esc(c.partido || "sem partido")} · ${c.nr}${c.situacao ? ` · <span class="pilula ${el ? "eleito" : "nao"}">${el ? "eleito" : esc(c.situacao.toLowerCase())}</span>` : ""}</span>
    </li>`;
  }).join("") || `<li class="vazio">Nenhum candidato encontrado.</li>`;
  $("#nota-lista").textContent = filtrados.length > vis.length
    ? `Mostrando ${vis.length} de ${fmt.format(filtrados.length)}. Refine a busca.` : `${fmt.format(filtrados.length)} candidatos.`;
}

/* ---------------------------------------------------------------- candidato */
async function abrirCandidato(id) {
  const c = E.meta.candidatos.find(x => x.id === id);
  if (!c || !c.detalhe) return;
  E.cand = id; E.cargo = String(c.cargo); E.pag = 0;
  document.querySelectorAll("#abas-cargo .aba").forEach(b => b.setAttribute("aria-pressed", b.dataset.cargo === E.cargo));
  document.querySelectorAll(".cand").forEach(li => li.setAttribute("aria-current", li.dataset.id === id));
  try { history.replaceState(null, "", "#c" + id); } catch (e) {}
  E.dadosCand = await carregar(`dados/${E.recorte}/cand/${id}.json.gz`);
  const n = E.L.n, v = new Float64Array(n);
  E.dadosCand.li.forEach((li, k) => { v[li] = E.dadosCand.v[k]; });
  E.votosLocal = v;
  E.valLocal = E.L.val[E.cargo];
  // municípios ordenados pelos votos do candidato
  const porMun = new Map();
  for (let i = 0; i < n; i++) if (v[i]) porMun.set(E.L.mun[i], (porMun.get(E.L.mun[i]) || 0) + v[i]);
  E.munOrdem = [...porMun.entries()].sort((a, b) => b[1] - a[1]);
  if (E.mun !== -1 && !porMun.has(E.mun)) E.mun = -1;
  montarFicha(c);
}

function montarFicha(c) {
  const ficha = $("#ficha");
  ficha.innerHTML = "";
  ficha.append($("#tpl-ficha").content.cloneNode(true));
  const el = /^ELEITO/i.test(c.situacao);
  $("#c-nome").textContent = c.nome;
  $("#c-meta").innerHTML = `${esc(E.meta.cargos[E.cargo].nome)} · ${esc(c.partido || "sem partido")} · nº <span class="num">${c.nr}</span>${c.situacao ? ` · <span class="pilula ${el ? "eleito" : "nao"}">${el ? esc(c.situacao.toLowerCase()) : esc(c.situacao.toLowerCase())}</span>` : ""}`;
  $("#c-votos").textContent = fmt.format(c.votos);
  desenharContas(c);
  const pos = E.meta.candidatos.filter(x => String(x.cargo) === E.cargo).findIndex(x => x.id === c.id) + 1;
  $("#c-votos-rot").textContent = `votos · ${pos}º mais votado · ${fmt1.format(100 * c.votos / E.meta.cargos[E.cargo].validos_uf)}% dos válidos`;

  $("#sel-mun").innerHTML = `<option value="-1">Toda a UF</option>` + E.munOrdem.map(([m, vv]) =>
    `<option value="${m}">${esc(E.meta.municipios[m])} (${fmt.format(vv)})</option>`).join("");
  $("#sel-mun").value = String(E.mun);
  $("#sel-nivel").innerHTML = Object.entries(E.meta.niveis).map(([k, r]) => `<option value="${k}">${esc(r)}</option>`).join("");
  $("#sel-nivel").value = E.nivel;
  const opcoesX = E.meta.indicadores.filter(i => !PERFIL_FORA.has(i.chave));
  $("#sel-x").innerHTML = opcoesX.map(i => `<option value="${i.chave}">${esc(i.rotulo)}</option>`).join("");
  $("#sel-x").value = E.x;
  $("#exportar").hidden = !downloads;
  document.querySelectorAll("#abas-tab .aba").forEach(x => x.setAttribute("aria-pressed", x.dataset.tab === E.tab));

  $("#sel-mun").addEventListener("change", e => { E.mun = +e.target.value; E.pag = 0; atualizar(true); });
  $("#sel-nivel").addEventListener("change", e => { E.nivel = e.target.value; atualizar(false); });
  $("#sel-x").addEventListener("change", e => { E.x = e.target.value; desenharDispersao(); });
  $("#abas-tab").addEventListener("click", e => {
    const b = e.target.closest("[data-tab]"); if (!b) return;
    E.tab = b.dataset.tab; E.pag = 0;
    document.querySelectorAll("#abas-tab .aba").forEach(x => x.setAttribute("aria-pressed", x === b));
    desenharTabela();
  });
  $("#sel-ord").addEventListener("change", e => { const o = ORDENS[e.target.value]; if (o) { E.ord = { col: o[0], dir: o[1] }; E.pag = 0; desenharTabela(); } });
  $("#pag-ant").addEventListener("click", () => { E.pag--; desenharTabela(); });
  $("#pag-prox").addEventListener("click", () => { E.pag++; desenharTabela(); });
  $("#exportar").addEventListener("click", exportarCSV);
  $("#abas-top").addEventListener("click", e => { const b = e.target.closest("[data-ord]"); if (b) { E.ordTop = b.dataset.ord; desenharTop(); } });
  $("#c-top").addEventListener("click", e => { const b = e.target.closest("button[data-li]"); if (b && !b.disabled) irParaLocal(+b.dataset.li); });

  criarMapa();
  atualizar(true);
}

const fmtRc = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", notation: "compact", maximumFractionDigits: 1 });
const fmtR2 = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: 2, maximumFractionDigits: 2 });

function desenharContas(c) {
  const alvo = $("#c-contas"), info = E.meta.contas;
  if (!info) { alvo.hidden = true; return; }
  alvo.hidden = false;
  const ref = info.referencia ? ` até ${esc(info.referencia)}` : "";
  const prazo = info.prazo_final ? new Date(info.prazo_final + "T12:00:00").toLocaleDateString("pt-BR") : "";
  const situ = info.situacao === "parcial"
    ? `parcial: a prestação final vence em ${prazo}`
    : "prestação final";
  const dica = `Valores declarados pela campanha ao TSE (prestação de contas). Despesas são as contratadas pela campanha. Dinheiro público é o que veio do Fundo Eleitoral (FEFC) e do Fundo Partidário, inclusive repassado pelo partido. ${info.situacao === "parcial" ? `Os números ainda são parciais: a prestação de contas final do 1º turno vence em ${prazo}, e este site atualiza toda segunda-feira.` : ""}`;
  const k = c.contas;
  if (!k) {
    alvo.innerHTML = `Campanha: nenhuma prestação de contas publicada pelo TSE${ref} <span class="nota">(${situ})</span> <button type="button" class="ajuda" aria-label="O que é isso? ${esc(dica)}" data-dica="${esc(dica)}">?</button>`;
    return;
  }
  const pctPub = k.rec ? ` (${fmt.format(Math.round(100 * k.pub / k.rec))}%)` : "";
  const porVoto = k.desp && c.votos ? ` · <b>${fmtR2.format(k.desp / c.votos)}</b> por voto` : "";
  alvo.innerHTML = `Campanha${ref}: <b>${fmtRc.format(k.desp)}</b> em despesas · <b>${fmtRc.format(k.rec)}</b> arrecadados, `
    + `<b>${fmtRc.format(k.pub)}</b>${pctPub} de dinheiro público${porVoto} <span class="nota">(${situ})</span> `
    + `<button type="button" class="ajuda" aria-label="O que é isso? ${esc(dica)}" data-dica="${esc(dica)}">?</button>`;
}

function filtro(i) { return E.mun === -1 || E.L.mun[i] === E.mun; }

function atualizar(reenquadrar) {
  desenharNumeros();
  desenharMapa(reenquadrar);
  desenharPerfil();
  desenharDispersao();
  desenharTabela();
}

function desenharNumeros() {
  const v = E.votosLocal, val = E.valLocal, n = E.L.n;
  let tot = 0, locais = 0, locaisTotal = 0;
  for (let i = 0; i < n; i++) if (filtro(i)) { locaisTotal++; if (v[i] > 0) { tot += v[i]; locais++; } }
  const secoes = E.dadosCand.s_li.filter(li => filtro(li)).length;
  const total = E.meta.candidatos.find(c => c.id === E.cand).votos;
  const ondeTxt = E.mun === -1 ? "do estado" : "do município";
  const itens = [];
  if (E.mun !== -1) itens.push([fmt.format(tot), `votos neste município (${fmt1.format(100 * tot / total)}% do total dele)`]);
  itens.push([`${fmt.format(locais)} <small>de ${fmt.format(locaisTotal)}</small>`, "locais de votação com voto",
    `Locais de votação (em geral escolas) onde o candidato teve pelo menos 1 voto, entre todos os locais ${ondeTxt}. Cada local reúne várias seções.`]);
  itens.push([fmt.format(secoes), "seções com voto",
    `Seções eleitorais (cada uma é uma urna, com algumas centenas de eleitores) onde o candidato teve pelo menos 1 voto ${ondeTxt}.`]);
  if (E.mun === -1) {
    let valTot = 0; for (let i = 0; i < n; i++) valTot += val[i];
    for (const [m, vm] of E.munOrdem.slice(0, 2)) {
      let valM = 0; for (let i = 0; i < n; i++) if (E.L.mun[i] === m) valM += val[i];
      const nome = E.meta.municipios[m];
      itens.push([fmt1.format(100 * vm / total) + "%", `dos votos dele vêm de ${nome}`,
        `${nome} tem ${fmt1.format(100 * valM / valTot)}% dos votos válidos do cargo no estado. Se a fatia dos votos dele for maior que isso, o voto dele está concentrado na cidade; se for menor, vem mais de fora dela.`,
        `cidade tem ${fmt1.format(100 * valM / valTot)}% dos válidos`]);
    }
  }
  $("#c-numeros").innerHTML = itens.map(([b, rot, dica, extra]) => `<div><b>${b}</b><span class="rot">${esc(rot)}${dica ? ` <button type="button" class="ajuda" aria-label="O que é isso? ${esc(dica)}" data-dica="${esc(dica)}">?</button>` : ""}${extra ? `<br>${esc(extra)}` : ""}</span></div>`).join("");
  desenharTop();
}

const MIN_VALIDOS_PCT = 200;  // locais muito pequenos distorcem o ranking por %

function desenharTop() {
  const v = E.votosLocal, val = E.valLocal, L0 = E.L, idx = [], porPct = E.ordTop === "pct";
  for (let i = 0; i < L0.n; i++) if (filtro(i) && v[i] > 0 && (!porPct || val[i] >= MIN_VALIDOS_PCT)) idx.push(i);
  if (porPct) idx.sort((a, b) => v[b] / val[b] - v[a] / val[a] || v[b] - v[a]);
  else idx.sort((a, b) => v[b] - v[a]);
  document.querySelectorAll("#abas-top .aba").forEach(b => b.setAttribute("aria-pressed", b.dataset.ord === E.ordTop));
  const onde = E.mun === -1 ? "" : " em " + E.meta.municipios[E.mun];
  $("#top-titulo").textContent = porPct ? `Os 10 locais onde ele foi mais forte${onde}` : `Os 10 locais com mais votos${onde}`;
  $("#top-expl").textContent = porPct
    ? `Ordenados pela fatia dele nos votos válidos do local (só locais com pelo menos ${MIN_VALIDOS_PCT} votos válidos, para não destacar locais minúsculos). Clique num local para vê-lo no mapa.`
    : "Ordenados pelo número de votos dele. Clique num local para vê-lo no mapa.";
  $("#c-top").innerHTML = idx.slice(0, 10).map((i, k) => {
    const sem = L0.lat[i] == null;
    return `<li><button type="button" data-li="${i}" ${sem ? "disabled title=\"O TSE não publicou a coordenada deste local\"" : ""}>
      <span class="pos">${k + 1}</span>
      <span class="nm">${esc(L0.nome[i])}</span>
      <span class="vt">${porPct
        ? `${fmt1.format(100 * v[i] / val[i])}%<small>${fmt.format(v[i])} de ${fmt.format(val[i])} válidos</small>`
        : `${fmt.format(v[i])}<small>${val[i] ? fmt1.format(100 * v[i] / val[i]) + "% dos válidos" : ""}</small>`}</span>
      <span class="onde">${esc(ondeLocal(i))}${sem ? " · sem coordenada" : ""}</span>
    </button></li>`;
  }).join("");
}

function ondeLocal(i) {
  const L0 = E.L, mun = E.meta.municipios[L0.mun[i]], b = L0.bairro_ibge[i] || L0.bairro[i] || "";
  return b && norm(b) !== norm(mun) ? `${b} · ${mun}` : mun;
}

function irParaLocal(i) {
  const c = E.marcadores && E.marcadores.get(i);
  if (!mapa || !c) return;
  $("#mapa").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
  mapa.setView(c.getLatLng(), Math.max(mapa.getZoom(), 14));
  setTimeout(() => c.openPopup(), 250);
}

/* ---------------------------------------------------------------- mapa */
function criarMapa() {
  if (typeof L === "undefined") { $("#mapa").innerHTML = `<div class="vazio">O mapa não carregou (biblioteca bloqueada).</div>`; return; }
  mapa = L.map("mapa", { preferCanvas: true, attributionControl: false, zoomSnap: 0.25, minZoom: 4 });
  camadaLim = L.layerGroup().addTo(mapa);
  camadaPontos = L.layerGroup().addTo(mapa);
  if (E.lim) {
    const estilo = (tipo) => () => ({ color: tipo === "mun" ? tok("--linha-2") : tok("--linha"), weight: tipo === "mun" ? 1 : 0.6, fill: tipo === "mun", fillColor: tok("--folha"), fillOpacity: tipo === "mun" ? 0.55 : 0, interactive: false });
    const mun = L.geoJSON(E.lim.mun, { style: estilo("mun") });
    const dist = L.geoJSON(E.lim.dist, { style: estilo("dist") });
    mapa._retemaLim = () => { mun.setStyle(estilo("mun")()); dist.setStyle(estilo("dist")()); };
    camadaLim.addLayer(mun);
    const zoom = () => { if (mapa.getZoom() >= 10) camadaLim.addLayer(dist); else camadaLim.removeLayer(dist); };
    mapa.on("zoomend", zoom);
  }
  mapa.on("zoomend", () => camadaPontos.eachLayer(c => c._raioBase && c.setRadius(c._raioBase * fatorZoom())));
}

function rampa() { return ["--r0", "--r1", "--r2", "--r3", "--r4", "--r5"].map(tok); }

function desenharMapa(reenquadrar) {
  if (!mapa) return;
  camadaPontos.clearLayers();
  E.marcadores = new Map();
  const v = E.votosLocal, val = E.valLocal, L0 = E.L, n = L0.n;
  const idx = [];
  let maxv = 0;
  for (let i = 0; i < n; i++) if (filtro(i) && v[i] > 0 && L0.lat[i] != null) { idx.push(i); if (v[i] > maxv) maxv = v[i]; }
  if (!idx.length) { mapa.setView([-15, -50], 4); $("#legenda").innerHTML = "Sem locais com coordenada para mostrar."; return; }
  const fatias = idx.map(i => val[i] ? 100 * v[i] / val[i] : 0).slice().sort((a, b) => a - b);
  const q = [1, 2, 3, 4, 5].map(k => fatias[Math.floor(k * (fatias.length - 1) / 6)]);
  const cores = rampa();
  const cls = s => { let k = 0; while (k < 5 && s > q[k]) k++; return k; };
  idx.sort((a, b) => v[b] - v[a]); // pequenos por cima
  for (let t = idx.length - 1; t >= 0; t--) {
    const i = idx[t], s = val[i] ? 100 * v[i] / val[i] : 0;
    const c = L.circleMarker([L0.lat[i], L0.lon[i]], {
      radius: (1.5 + 13 * Math.sqrt(v[i] / maxv)) * fatorZoom(), color: tok("--folha"), weight: 0.6,
      fillColor: cores[cls(s)], fillOpacity: 0.9,
    });
    c._raioBase = 1.5 + 13 * Math.sqrt(v[i] / maxv);
    c.bindPopup(() => popupLocal(i), { maxWidth: 300 });
    E.marcadores.set(i, c);
    camadaPontos.addLayer(c);
  }
  if (reenquadrar) {
    const b = L.latLngBounds(idx.map(i => [L0.lat[i], L0.lon[i]]));
    mapa.fitBounds(b.pad(0.08), { maxZoom: 14 });
  }
  const lim = [fatias[0], ...q, fatias[fatias.length - 1]];
  $("#legenda").innerHTML = `<span>% do candidato nos votos válidos do local (sextis):</span>` + cores.map((c, k) =>
    `<span class="faixa"><i style="background:${c}"></i><span class="num">${fmt1.format(lim[k])}–${fmt1.format(lim[k + 1])}%</span></span>`).join("");
  setTimeout(() => mapa.invalidateSize(), 0);
}

function popupLocal(i) {
  const L0 = E.L, ind = L0.ind[E.nivel] || {}, v = E.votosLocal[i], val = E.valLocal[i];
  const linhas = [["Votos", fmt.format(v)], ["% dos válidos", val ? fmt1.format(100 * v / val) + "%" : "–"], ["Eleitores", fmt.format(L0.eleit[i] || 0)]];
  for (const k of COLUNAS_TAB) if (ind[k]) linhas.push([rotuloInd(k), valor(k, ind[k][i])]);
  return `<div class="pop"><h4>${esc(L0.nome[i])}</h4>
    <div class="end">${esc(L0.end[i])} · ${esc(ondeLocal(i))}<br>
    <span class="num">Zona ${pad(L0.zona[i], 4)} · Local ${pad(L0.nr[i], 4)}</span></div>
    <dl>${linhas.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${b}</dd>`).join("")}</dl>
    <div class="nota" style="margin-top:6px">Censo: ${esc(E.meta.niveis[E.nivel])}</div></div>`;

/* ---------------------------------------------------------------- perfil */
function mediaPond(x, w, mascara) {
  let s = 0, p = 0;
  for (let i = 0; i < x.length; i++) {
    if (!mascara(i) || x[i] == null || !w[i]) continue;
    s += x[i] * w[i]; p += w[i];
  }
  return p ? s / p : null;
}

// comp: categorias que somam 100% (célula suprimida pelo IBGE, 1 ou 2 pessoas, conta como 0)
const GRUPOS_PERFIL = [
  ["Renda e escolaridade", ["renda_media_responsavel", "pct_alfabetizados_15_mais"]],
  ["Cor ou raça", ["pct_branca", "pct_parda", "pct_preta", "pct_amarela", "pct_indigena"], { comp: true, subtotal: ["Pretos e pardos", ["pct_preta", "pct_parda"]] }],
  ["Idade", ["pct_0_14", "pct_15_24", "pct_25_39", "pct_40_59", "pct_60_mais"], { comp: true }],
  ["Território", ["pct_pop_favela", "pct_pop_rural", "densidade_hab_km2"]],
];

// arredonda para 1 casa mantendo a soma em 100,0 (maiores restos)
function fecha100(vals) {
  const tot = vals.reduce((a, b) => a + b, 0);
  if (!tot) return vals;
  const esc10 = vals.map(x => 1000 * x / tot), base = esc10.map(Math.floor);
  let falta = 1000 - base.reduce((a, b) => a + b, 0);
  esc10.map((x, i) => [x - base[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (falta > 0) { base[i]++; falta--; } });
  return base.map(x => x / 10);
}

function desenharPerfil() {
  const ind = E.L.ind[E.nivel] || {}, v = E.votosLocal, val = E.valLocal;
  const usa = i => filtro(i) && E.L.lat[i] != null;
  const onde = E.mun === -1 ? `do estado (${E.meta.uf})` : `de ${E.meta.municipios[E.mun]}`;
  $("#perfil-expl").textContent = `Para cada indicador do censo (nível "${E.meta.niveis[E.nivel]}"), a média dos locais de votação ponderada pelos votos dele, comparada com a média ponderada pelos votos válidos do cargo ${onde}.`;
  let html = "";
  for (const [grupo, chaves0, opt = {}] of GRUPOS_PERFIL) {
    const chaves = chaves0.filter(k => ind[k]);
    if (!chaves.length) continue;
    // série de valores por indicador; em grupos de composição, nulo vira 0 onde o local tem alguma categoria
    const serie = {};
    let mascara = usa;
    if (opt.comp) {
      const tem = new Uint8Array(E.L.n);
      for (let i = 0; i < E.L.n; i++) tem[i] = chaves.some(k => ind[k][i] != null) ? 1 : 0;
      mascara = i => usa(i) && tem[i] === 1;
      for (const k of chaves) serie[k] = ind[k].map(x => x == null ? 0 : x);
    } else for (const k of chaves) serie[k] = ind[k];
    const medias = chaves.map(k => [mediaPond(serie[k], v, mascara), mediaPond(serie[k], val, mascara)]);
    if (medias.some(([a, b]) => a == null || b == null)) continue;
    let mostra = medias.map(m => m.slice());
    if (opt.comp) {
      const c = fecha100(medias.map(m => m[0])), e = fecha100(medias.map(m => m[1]));
      mostra = c.map((x, j) => [x, e[j]]);
    }
    const linhas = chaves.map((k, j) => {
      const meta = E.meta.indicadores.find(i => i.chave === k) || { rotulo: k, unidade: "" };
      const xs = [];
      for (let i = 0; i < E.L.n; i++) if (mascara(i) && val[i] > 0 && serie[k][i] != null) xs.push(serie[k][i]);
      xs.sort((a, b) => a - b);
      const q = f => xs[Math.floor(f * (xs.length - 1))];
      let lo = q(0.1), hi = q(0.9);
      if (!(hi - lo > 1e-6)) { lo = q(0); hi = q(0.99); }
      const [cand, ele] = medias[j], [candM, eleM] = mostra[j];
      const pos = x => Math.min(100, Math.max(0, hi > lo ? 100 * (x - lo) / (hi - lo) : 50));
      const pct = meta.unidade === "%";
      const d = pct ? candM - eleM : (ele ? 100 * (cand - ele) / ele : 0);
      const pequeno = pct ? Math.abs(d) < 0.5 : Math.abs(d) < 2;
      const txt = pequeno ? "≈ eleitorado" : `${d > 0 ? "+" : "−"}${fmt1.format(Math.abs(d))}${pct ? " p.p." : "%"}`;
      const vC = pct ? fmt1.format(candM) + "%" : valor(k, cand), vE = pct ? fmt1.format(eleM) + "%" : valor(k, ele);
      const dica = `${meta.rotulo}: média dos votos dele ${vC}; do eleitorado ${vE}. Nos locais ${onde}, 10% ficam abaixo de ${valor(k, lo)} e 10% acima de ${valor(k, hi)}.`;
      return `<div class="ln" title="${esc(dica)}">
        <span class="rotulo-ind">${esc(meta.rotulo)}</span>
        <span class="regua" aria-hidden="true"><span class="eixo"></span>
          <span class="ele" style="left:${pos(ele)}%"></span><span class="cand" style="left:${pos(cand)}%"></span>
          <span class="ext a">${esc(curto(k, lo))}</span><span class="ext b">${esc(curto(k, hi))}</span></span>
        <span class="val"><b>${vC}</b><span class="${pequeno ? "" : d > 0 ? "mais" : "menos"}">${txt}</span></span>
      </div>`;
    }).join("");
    let rodape = "";
    if (opt.comp) {
      const somaC = mostra.reduce((a, m) => a + m[0], 0), somaE = mostra.reduce((a, m) => a + m[1], 0);
      let sub = "";
      if (opt.subtotal) {
        const [rot, ks] = opt.subtotal, js = ks.map(k => chaves.indexOf(k)).filter(j => j >= 0);
        const c = js.reduce((a, j) => a + mostra[j][0], 0), e = js.reduce((a, j) => a + mostra[j][1], 0);
        sub = `${esc(rot)}: <b>${fmt1.format(c)}%</b> (eleitorado ${fmt1.format(e)}%) · `;
      }
      rodape = `<div class="soma">${sub}categorias somam ${fmt1.format(somaC)}% (eleitorado ${fmt1.format(somaE)}%)</div>`;
    }
    html += `<h4>${esc(grupo)}</h4>` + linhas + rodape;
  }
  $("#perfil").innerHTML = html || `<div class="vazio">Sem dados do censo para este recorte.</div>`;
}

function curto(k, x) {
  const meta = E.meta.indicadores.find(i => i.chave === k) || {};
  if (meta.unidade === "R$") return "R$ " + fmt.format(Math.round(x / 100) * 100);
  if (meta.unidade === "%") return (x < 10 ? fmt1.format(x) : fmt.format(Math.round(x))) + "%";
  return fmt.format(Math.round(x));
}

/* ---------------------------------------------------------------- dispersão */
function desenharDispersao() {
  const cv = $("#disp"); if (!cv) return;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const xs = (E.L.ind[E.nivel] || {})[E.x]; if (!xs) return;
  const v = E.votosLocal, val = E.valLocal, pts = [];
  for (let i = 0; i < E.L.n; i++) if (filtro(i) && val[i] > 0 && xs[i] != null) pts.push([xs[i], 100 * v[i] / val[i], val[i]]);
  if (pts.length < 3) { $("#corr").textContent = "Poucos locais para o gráfico."; return; }
  const ordX = pts.map(p => p[0]).sort((a, b) => a - b), ordY = pts.map(p => p[1]).sort((a, b) => a - b);
  const pct = (a, q) => a[Math.floor(q * (a.length - 1))];
  const x0 = pct(ordX, 0.01), x1 = pct(ordX, 0.99), y1 = Math.max(1, pct(ordY, 0.995)) * 1.05;
  const m = { l: 52, r: 12, t: 10, b: 36 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const X = x => m.l + (Math.min(Math.max(x, x0), x1) - x0) / ((x1 - x0) || 1) * pw;
  const Y = y => m.t + ph - Math.min(y, y1) / y1 * ph;
  g.font = `11px ${tok("--f-dado")}`; g.fillStyle = tok("--tinta-3"); g.strokeStyle = tok("--linha"); g.lineWidth = 1;
  const meta = E.meta.indicadores.find(i => i.chave === E.x);
  const ticks = (a, b, k) => { const p = Math.pow(10, Math.floor(Math.log10((b - a) / k || 1))); const st = [1, 2, 5, 10].map(s => s * p).find(s => (b - a) / s <= k) || p * 10; const r = []; for (let t = Math.ceil(a / st) * st; t <= b + 1e-9; t += st) r.push(t); return r; };
  g.textAlign = "right"; g.textBaseline = "middle";
  for (const t of ticks(0, y1, 5)) { const y = Y(t); g.beginPath(); g.moveTo(m.l, y); g.lineTo(W - m.r, y); g.stroke(); g.fillText(fmt.format(t) + "%", m.l - 6, y); }
  g.textAlign = "center"; g.textBaseline = "top";
  for (const t of ticks(x0, x1, Math.max(3, Math.floor(pw / 90)))) { const x = X(t); g.beginPath(); g.moveTo(x, m.t); g.lineTo(x, m.t + ph); g.stroke();
    g.fillText(meta.unidade === "R$" ? fmt.format(t) : fmt.format(t), x, m.t + ph + 6); }
  g.fillStyle = tok("--tinta-2"); g.font = `12px ${tok("--f-texto")}`;
  g.fillText(`${meta.rotulo} (${meta.unidade}) · ${E.meta.niveis[E.nivel]}`, m.l + pw / 2, H - 14);
  g.save(); g.translate(12, m.t + ph / 2); g.rotate(-Math.PI / 2); g.fillText("% do candidato nos válidos", 0, -6); g.restore();
  const maxw = Math.max(...pts.map(p => p[2]));
  g.fillStyle = tok("--carimbo"); g.globalAlpha = 0.35;
  for (const [x, y, w] of pts) { g.beginPath(); g.arc(X(x), Y(y), 1 + 4 * Math.sqrt(w / maxw), 0, 7); g.fill(); }
  g.globalAlpha = 1;
  // regressão ponderada
  let sw = 0, sx = 0, sy = 0; for (const [x, y, w] of pts) { sw += w; sx += w * x; sy += w * y; }
  const mx = sx / sw, my = sy / sw; let sxy = 0, sxx = 0, syy = 0;
  for (const [x, y, w] of pts) { sxy += w * (x - mx) * (y - my); sxx += w * (x - mx) ** 2; syy += w * (y - my) ** 2; }
  const b = sxx ? sxy / sxx : 0, a = my - b * mx, r = sxx && syy ? sxy / Math.sqrt(sxx * syy) : 0;
  g.strokeStyle = tok("--tinta"); g.lineWidth = 2; g.beginPath(); g.moveTo(X(x0), Y(a + b * x0)); g.lineTo(X(x1), Y(a + b * x1)); g.stroke();
  const forca = Math.abs(r) < 0.1 ? "praticamente nula" : Math.abs(r) < 0.3 ? "fraca" : Math.abs(r) < 0.5 ? "moderada" : "forte";
  $("#corr").innerHTML = `Correlação ponderada <b class="num">r = ${r.toFixed(2).replace(".", ",")}</b> (${forca}, ${r >= 0 ? "positiva" : "negativa"}) em ${fmt.format(pts.length)} locais. Descreve lugares, não pessoas: não diz como cada eleitor votou.`;
}

/* ---------------------------------------------------------------- tabela */
function linhasTabela() {
  const L0 = E.L, ind = L0.ind[E.nivel] || {}, v = E.votosLocal, val = E.valLocal, d = E.dadosCand, nome = E.meta.municipios;
  const cens = i => Object.fromEntries(COLUNAS_TAB.map(k => [k, ind[k] ? ind[k][i] : null]));
  if (E.tab === "secoes") {
    const out = [];
    for (let k = 0; k < d.s_li.length; k++) {
      const i = d.s_li[k]; if (!filtro(i)) continue;
      out.push({ mun: nome[L0.mun[i]], zona: L0.zona[i], secao: d.s_sec[k], local: L0.nome[i], bairro: L0.bairro_ibge[i] || L0.bairro[i],
        votos: d.s_v[k], val: d.s_val[k], pct: d.s_val[k] ? 100 * d.s_v[k] / d.s_val[k] : null, _i: i, ...cens(i) });
    }
    return out;
  }
  if (E.tab === "locais") {
    const out = [];
    for (let i = 0; i < L0.n; i++) if (filtro(i) && v[i] > 0)
      out.push({ mun: nome[L0.mun[i]], zona: L0.zona[i], local: L0.nome[i], end: L0.end[i], bairro: L0.bairro_ibge[i] || L0.bairro[i],
        votos: v[i], val: val[i], pct: val[i] ? 100 * v[i] / val[i] : null, eleit: L0.eleit[i], _i: i, ...cens(i) });
    return out;
  }
  // bairros: agrega por município + bairro do IBGE (ou do TSE quando o local não tem coordenada)
  const indB = L0.ind.bairro || {}, g = new Map();
  for (let i = 0; i < L0.n; i++) {
    if (!filtro(i) || !val[i]) continue;
    const b = L0.bairro_ibge[i] || ("TSE: " + (L0.bairro[i] || "sem bairro"));
    const key = L0.mun[i] + "|" + b;
    let r = g.get(key);
    if (!r) { r = { mun: nome[L0.mun[i]], bairro: b, votos: 0, val: 0, locais: 0, ...Object.fromEntries(COLUNAS_TAB.map(k => [k, indB[k] && L0.bairro_ibge[i] ? indB[k][i] : null])) }; g.set(key, r); }
    r.votos += v[i]; r.val += val[i]; r.locais += v[i] > 0 ? 1 : 0;
  }
  return [...g.values()].filter(r => r.votos > 0).map(r => ({ ...r, pct: r.val ? 100 * r.votos / r.val : null }));
}

function colunasTabela() {
  const cens = COLUNAS_TAB.map(k => ({ k, t: rotuloInd(k), n: true, f: x => valor(k, x) }));
  const nu = x => fmt.format(x), pc = x => x == null ? "–" : fmt1.format(x) + "%";
  if (E.tab === "secoes") return [{ k: "mun", t: "Município", c: "m" }, { k: "zona", t: "Zona", n: true, f: x => pad(x, 4) }, { k: "secao", t: "Seção", n: true, f: x => pad(x, 4) },
    { k: "local", t: "Local de votação", c: "t" }, { k: "bairro", t: "Bairro" }, { k: "votos", t: "Votos", n: true, f: nu }, { k: "val", t: "Válidos", n: true, f: nu }, { k: "pct", t: "% válidos", n: true, f: pc }, ...cens];
  if (E.tab === "locais") return [{ k: "mun", t: "Município", c: "m" }, { k: "zona", t: "Zona", n: true, f: x => pad(x, 4) }, { k: "local", t: "Local de votação", c: "t" },
    { k: "end", t: "Endereço", c: "t" }, { k: "bairro", t: "Bairro" }, { k: "votos", t: "Votos", n: true, f: nu }, { k: "val", t: "Válidos", n: true, f: nu }, { k: "pct", t: "% válidos", n: true, f: pc }, { k: "eleit", t: "Eleitores", n: true, f: nu }, ...cens];
  return [{ k: "mun", t: "Município", c: "m" }, { k: "bairro", t: "Bairro", c: "t" }, { k: "locais", t: "Locais com voto", n: true, f: nu }, { k: "votos", t: "Votos", n: true, f: nu },
    { k: "val", t: "Válidos", n: true, f: nu }, { k: "pct", t: "% válidos", n: true, f: pc }, ...COLUNAS_TAB.map(k => ({ k, t: rotuloInd(k), n: true, f: x => valor(k, x) }))];
}

const MIN_VALIDOS_TAB = { secoes: 50, locais: MIN_VALIDOS_PCT, bairros: 1000 };
const ORDENS = { votos: ["votos", -1], pct: ["pct", -1], pct_asc: ["pct", 1], val: ["val", -1] };
function sincronizaOrdem() {
  const sel = $("#sel-ord"); if (!sel) return;
  const achou = Object.entries(ORDENS).find(([, [c, d]]) => c === E.ord.col && d === E.ord.dir);
  if (achou) sel.value = achou[0];
  else if (![...sel.options].some(o => o.value === "outra")) sel.insertAdjacentHTML("beforeend", `<option value="outra">Coluna escolhida na tabela</option>`);
  if (!achou) sel.value = "outra";
  else { const o = sel.querySelector('option[value="outra"]'); if (o) o.remove(); }
}

function desenharTabela() {
  const cols = colunasTabela(), linhas = linhasTabela();
  sincronizaOrdem();
  const { col, dir } = E.ord;
  const minimo = col === "pct" ? MIN_VALIDOS_TAB[E.tab] : 0;
  const pequena = r => minimo && (r.val || 0) < minimo;
  linhas.sort((a, b) => {
    if (pequena(a) !== pequena(b)) return pequena(a) ? 1 : -1;  // linhas minúsculas não disputam o ranking por %
    const x = a[col], y = b[col]; if (x == null) return 1; if (y == null) return -1; return (x < y ? -1 : x > y ? 1 : 0) * dir;
  });
  const nPeq = minimo ? linhas.filter(pequena).length : 0;
  $("#nota-ord").textContent = nPeq
    ? `Ordenando por %: ${fmt.format(nPeq)} ${E.tab === "secoes" ? "seções" : E.tab === "locais" ? "locais" : "bairros"} com menos de ${fmt.format(minimo)} votos válidos ficam no fim da lista, porque nelas poucos votos mudam muito o percentual.`
    : "";
  const POR = 100, paginas = Math.max(1, Math.ceil(linhas.length / POR));
  E.pag = Math.min(Math.max(0, E.pag), paginas - 1);
  const vis = linhas.slice(E.pag * POR, E.pag * POR + POR);
  const nivelNota = E.tab === "bairros" ? "Bairro (IBGE)" : E.meta.niveis[E.nivel];
  $("#tabela").innerHTML = `<thead><tr>${cols.map(c => `<th class="${c.n ? "n" : ""}" data-k="${c.k}" ${c.k === col ? `aria-sort="${dir > 0 ? "ascending" : "descending"}"` : ""} title="${COLUNAS_TAB.includes(c.k) ? "Censo: " + esc(nivelNota) : ""}">${esc(c.t)}${c.k === col ? (dir > 0 ? " ↑" : " ↓") : ""}</th>`).join("")}</tr></thead>
    <tbody>${vis.map(r => `<tr>${cols.map(c => `<td class="${c.n ? "n" : ""} ${c.c || ""} ${c.n ? "num" : ""}">${c.f ? c.f(r[c.k]) : esc(r[c.k])}</td>`).join("")}</tr>`).join("") || `<tr><td class="vazio" colspan="${cols.length}">Nada para mostrar com este filtro.</td></tr>`}</tbody>`;
  $("#tabela thead").addEventListener("click", e => {
    const th = e.target.closest("th"); if (!th) return;
    const k = th.dataset.k; E.ord = { col: k, dir: E.ord.col === k ? -E.ord.dir : (["mun", "local", "bairro", "end"].includes(k) ? 1 : -1) }; E.pag = 0; desenharTabela();
  });
  $("#pag-info").textContent = `${fmt.format(linhas.length)} linhas · página ${E.pag + 1} de ${paginas}`;
  $("#pag-ant").disabled = E.pag === 0; $("#pag-prox").disabled = E.pag >= paginas - 1;
}

async function exportarCSV() {
  if (!downloads) return;
  const b = $("#exportar"), L0 = E.L;
  const linhas = linhasTabela(), cols = colunasTabela().filter(c => !COLUNAS_TAB.includes(c.k));
  const extras = [];
  if (E.tab !== "bairros") for (const nv of Object.keys(E.meta.niveis)) for (const i of E.meta.indicadores) if (L0.ind[nv] && L0.ind[nv][i.chave]) extras.push([nv, i.chave]);
  const cab = cols.map(c => c.t).concat(E.tab === "bairros" ? COLUNAS_TAB.map(k => "bairro_" + k) : extras.map(([nv, k]) => nv + "_" + k));
  if (E.tab !== "bairros") cab.splice(cols.length, 0, "lat", "lon", "setor_ibge");
  const q = s => { s = s == null ? "" : String(s); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const nb = x => x == null ? "" : String(Math.round(x * 100) / 100).replace(".", ",");
  const corpo = linhas.map(r => {
    const base = cols.map(c => typeof r[c.k] === "number" ? nb(r[c.k]) : q(r[c.k]));
    if (E.tab === "bairros") return base.concat(COLUNAS_TAB.map(k => nb(r[k]))).join(";");
    const i = r._i;
    return base.concat([nb(L0.lat[i]), nb(L0.lon[i]), q(L0.setor[i])], extras.map(([nv, k]) => nb(L0.ind[nv][k][i]))).join(";");
  });
  const c = E.meta.candidatos.find(x => x.id === E.cand);
  const nome = `${E.recorte}_${c.nr}_${norm(c.nome).replace(/[^A-Z0-9]+/g, "_")}_${E.tab}.csv`.toLowerCase();
  b.disabled = true; b.textContent = "Preparando…";
  try {
    await downloads.save({ filename: nome, data: "﻿" + cab.map(q).join(";") + "\n" + corpo.join("\n") });
    b.textContent = "Baixado";
  } catch (e) {
    b.textContent = e && e.code === "declined" ? "Baixar CSV" : "Não foi possível baixar";
  } finally { b.disabled = false; setTimeout(() => { b.textContent = "Baixar CSV"; }, 2500); }
}

window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retema);

window.addEventListener("error", e => mostrarErro(e.message || String(e)));
