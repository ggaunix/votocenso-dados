name: processar dados do portal

# Roda quando alvos.txt ou o código mudam, ou manualmente.
on:
  push:
    branches: [main]
    paths: ["alvos.txt", "votocenso/**", "baixar_dados.sh", ".github/workflows/processar.yml"]
  workflow_dispatch:
  # toda segunda: atualiza as contas de campanha (mudam até a prestação final)
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

concurrency:
  group: processar
  cancel-in-progress: false

jobs:
  alvos:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.m.outputs.matriz }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          alvos = []
          for l in open("alvos.txt"):
              l = l.split("#")[0].split()
              if len(l) == 2:
                  alvos.append({"uf": l[0].upper(), "ano": l[1]})
          print("matriz=" + json.dumps({"include": alvos}))
          PY

  processar:
    needs: alvos
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.alvos.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: restaurar Censo (IBGE) do cache
        id: cache-ibge
        uses: actions/cache/restore@v4
        with:
          path: dados/ibge
          key: ibge-${{ matrix.uf }}-v1

      - name: restaurar zips do TSE do cache
        uses: actions/cache/restore@v4
        with:
          path: dados/zips
          key: tse-${{ matrix.uf }}-${{ matrix.ano }}-${{ github.run_id }}
          restore-keys: tse-${{ matrix.uf }}-${{ matrix.ano }}-

      - name: baixar TSE e IBGE
        run: |
          mkdir -p diagnostico/${{ matrix.ano }}_${{ matrix.uf }}
          set -o pipefail
          ./baixar_dados.sh ${{ matrix.uf }} ${{ matrix.ano }} 2>&1 | tee diagnostico/${{ matrix.ano }}_${{ matrix.uf }}/1_download.txt
          ls -la dados/zips dados/tse dados/ibge 2>&1 | tee -a diagnostico/${{ matrix.ano }}_${{ matrix.uf }}/1_download.txt

      - name: guardar Censo (IBGE) no cache
        if: steps.cache-ibge.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dados/ibge
          key: ibge-${{ matrix.uf }}-v1

      - name: guardar zips do TSE no cache
        uses: actions/cache/save@v4
        with:
          path: dados/zips
          key: tse-${{ matrix.uf }}-${{ matrix.ano }}-${{ github.run_id }}

      - name: conferir códigos do censo no dicionário
        run: |
          set -o pipefail
          python -m votocenso.verificar 2>&1 | tee diagnostico/${{ matrix.ano }}_${{ matrix.uf }}/2_variaveis.txt

      - name: gerar dados do portal
        run: |
          set -o pipefail
          python -m votocenso.exportar --ano ${{ matrix.ano }} --uf ${{ matrix.uf }} 2>&1 | tee diagnostico/${{ matrix.ano }}_${{ matrix.uf }}/3_exportar.txt
          du -sh portal_dados/${{ matrix.ano }}_${{ matrix.uf }} portal_dados/${{ matrix.ano }}_${{ matrix.uf }}/* 2>&1 | tee -a diagnostico/${{ matrix.ano }}_${{ matrix.uf }}/3_exportar.txt

      - name: gravar no repositório
        run: |
          cp saida/variaveis_usadas.csv portal_dados/${{ matrix.ano }}_${{ matrix.uf }}/ || true
          git config user.name "votocenso-bot"
          git config user.email "votocenso-bot@users.noreply.github.com"
          git add portal_dados/${{ matrix.ano }}_${{ matrix.uf }} diagnostico
          git commit -m "dados ${{ matrix.uf }} ${{ matrix.ano }} [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done

      - name: gravar diagnóstico mesmo se falhar
        if: failure()
        run: |
          git config user.name "votocenso-bot"
          git config user.email "votocenso-bot@users.noreply.github.com"
          git add -f diagnostico/${{ matrix.ano }}_${{ matrix.uf }} || true
          git commit -m "diagnóstico (falha) ${{ matrix.uf }} ${{ matrix.ano }} [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done

  site:
    needs: processar
    if: always() && needs.processar.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: montar e publicar o site (GitHub Pages)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git pull --rebase origin main
          python portal/preparar.py portal_dados
          python portal/montar_site.py portal _site
          cd _site
          git init -q -b gh-pages
          git config user.name "votocenso-bot"
          git config user.email "votocenso-bot@users.noreply.github.com"
          git add -A
          git commit -qm "site atualizado em $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" gh-pages
